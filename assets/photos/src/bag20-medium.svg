<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-labelledby="t d"><title id="t">Medium grade aragonite, 20 lb retail bag</title><desc id="d">Studio render of the 20 lb printed retail bag of medium grade oolitic aragonite, 1.0–2.0 mm, standing three-quarter front on a white sweep. A render of proposed packaging, not a photograph of a produced bag.</desc>
<defs>
  <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.52" stop-color="#FBFAF8"/>
    <stop offset="0.70" stop-color="#EFEDE8"/>
    <stop offset="1" stop-color="#E4E1DA"/>
  </linearGradient>
  <radialGradient id="vignette" cx="0.44" cy="0.40" r="0.78">
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="1" stop-color="#9A958C" stop-opacity="0.30"/>
  </radialGradient>

  <!-- The key is upper left, so the face brightens off-centre to the left and
       falls away to both edges. -->
