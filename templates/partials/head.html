<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{origin}}/{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="AragoCor Aragonite">
<meta property="og:image" content="{{origin}}/assets/mark-512.png">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{origin}}/{{canonical}}">
<meta property="og:image:alt" content="The AragoCor aragonite mark">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:locale" content="en_US">
<!-- The share image is a 512x512 mark, so `summary` is the right card: the
     large-image card expects roughly 2:1 and crops a square badly. Switch to
     summary_large_image only alongside a wide image made for it. -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{origin}}/assets/mark-512.png">
<meta name="twitter:image:alt" content="The AragoCor aragonite mark">
<meta name="theme-color" content="#0E3540">
<link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="assets/mark.svg">
<link rel="apple-touch-icon" sizes="180x180" href="assets/mark-180.png">
<link rel="stylesheet" href="css/ds/styles.css?v={{v_css_ds}}">
<link rel="stylesheet" href="css/tokens.css?v={{v_css_tokens}}">
<link rel="stylesheet" href="css/site.css?v={{v_css_site}}">
